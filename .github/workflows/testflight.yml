name: Deploy private Meg source to TestFlight

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact notzenco/meg commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meg-private-source-testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
      WATCH_BUNDLE_ID: ${{ vars.WATCH_BUNDLE_ID }}
      WATCH_WIDGET_BUNDLE_ID: ${{ vars.WATCH_WIDGET_BUNDLE_ID }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID }}

    steps:
      - name: Validate release configuration
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
          WATCH_PROVISIONING_PROFILE: ${{ secrets.WATCH_PROVISIONING_PROFILE }}
          WATCH_WIDGET_PROVISIONING_PROFILE: ${{ secrets.WATCH_WIDGET_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          required=(
            APPLE_TEAM_ID IOS_BUNDLE_ID IOS_WIDGET_BUNDLE_ID
            WATCH_BUNDLE_ID WATCH_WIDGET_BUNDLE_ID APP_GROUP_ID
            APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE IOS_WIDGET_PROVISIONING_PROFILE
            WATCH_PROVISIONING_PROFILE WATCH_WIDGET_PROVISIONING_PROFILE
            APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing release configuration: $name"
              exit 1
            fi
          done

      - name: Check out exact private source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: notzenco/meg
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.MEG_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
          show-progress: false

      - name: Verify private source revision
        working-directory: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          if [[ "$resolved" != "$SOURCE_REF" ]]; then
            echo "::error::Private checkout did not resolve to the requested commit."
            exit 1
          fi
          test -f project.yml
          test -f Meg/MegApp.swift
          echo "Validated the requested private source revision."

      - name: Validate supported Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          developer_dir="$(xcode-select -p)"
          case "$developer_dir" in
            *Xcode_27_beta_1.app/*|*Xcode_27_beta_2.app/*|*Xcode_27_beta_3.app/*)
              echo "::error::App Store Connect no longer accepts this Xcode image."
              exit 1
              ;;
            *Xcode_27*) ;;
            *)
              echo "::error::Expected an Xcode 27 runner."
              exit 1
              ;;
          esac

      - name: Install XcodeGen 2.45.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/xcodegen/install.sh"

      - name: Install and validate signing assets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
          WATCH_PROVISIONING_PROFILE: ${{ secrets.WATCH_PROVISIONING_PROFILE }}
          WATCH_WIDGET_PROVISIONING_PROFILE: ${{ secrets.WATCH_WIDGET_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          profile_path="$RUNNER_TEMP/meg.mobileprovision"
          widget_profile_path="$RUNNER_TEMP/meg-widget.mobileprovision"
          watch_profile_path="$RUNNER_TEMP/meg-watch.mobileprovision"
          watch_widget_profile_path="$RUNNER_TEMP/meg-watch-widget.mobileprovision"
          profile_plist="$RUNNER_TEMP/meg-profile.plist"
          widget_profile_plist="$RUNNER_TEMP/meg-widget-profile.plist"
          watch_profile_plist="$RUNNER_TEMP/meg-watch-profile.plist"
          watch_widget_profile_plist="$RUNNER_TEMP/meg-watch-widget-profile.plist"
          keychain_path="$RUNNER_TEMP/meg-signing.keychain-db"
          keychain_password="$(uuidgen)"
          profiles_path="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          printf '%s' "$IOS_WIDGET_PROVISIONING_PROFILE" | base64 -D > "$widget_profile_path"
          printf '%s' "$WATCH_PROVISIONING_PROFILE" | base64 -D > "$watch_profile_path"
          printf '%s' "$WATCH_WIDGET_PROVISIONING_PROFILE" | base64 -D > "$watch_widget_profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          security cms -D -i "$widget_profile_path" > "$widget_profile_plist"
          security cms -D -i "$watch_profile_path" > "$watch_profile_plist"
          security cms -D -i "$watch_widget_profile_path" > "$watch_widget_profile_plist"
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$widget_profile_plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$watch_profile_plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$watch_widget_profile_plist" >/dev/null 2>&1

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")"
          expiration_date="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist")"
          app_group="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$profile_plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist")"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$widget_profile_plist")"
          widget_application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$widget_profile_plist")"
          widget_get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$widget_profile_plist")"
          widget_expiration_date="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$widget_profile_plist")"
          widget_app_group="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$widget_profile_plist")"
          watch_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$watch_profile_plist")"
          watch_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$watch_profile_plist")"
          watch_application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$watch_profile_plist")"
          watch_get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$watch_profile_plist")"
          watch_expiration_date="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$watch_profile_plist")"
          watch_app_group="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$watch_profile_plist")"
          watch_widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$watch_widget_profile_plist")"
          watch_widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$watch_widget_profile_plist")"
          watch_widget_application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$watch_widget_profile_plist")"
          watch_widget_get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$watch_widget_profile_plist")"
          watch_widget_expiration_date="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$watch_widget_profile_plist")"
          watch_widget_app_group="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$watch_widget_profile_plist")"

          test "$application_identifier" = "$APPLE_TEAM_ID.$IOS_BUNDLE_ID"
          test "$get_task_allow" = "false"
          test "$app_group" = "$APP_GROUP_ID"
          test "$(date -j -f '%a %b %d %T %Z %Y' "$expiration_date" '+%s')" -gt "$(date '+%s')"
          test "$widget_application_identifier" = "$APPLE_TEAM_ID.$IOS_WIDGET_BUNDLE_ID"
          test "$widget_get_task_allow" = "false"
          test "$widget_app_group" = "$APP_GROUP_ID"
          test "$(date -j -f '%a %b %d %T %Z %Y' "$widget_expiration_date" '+%s')" -gt "$(date '+%s')"
          test "$watch_application_identifier" = "$APPLE_TEAM_ID.$WATCH_BUNDLE_ID"
          test "$watch_get_task_allow" = "false"
          test "$watch_app_group" = "$APP_GROUP_ID"
          test "$(date -j -f '%a %b %d %T %Z %Y' "$watch_expiration_date" '+%s')" -gt "$(date '+%s')"
          test "$watch_widget_application_identifier" = "$APPLE_TEAM_ID.$WATCH_WIDGET_BUNDLE_ID"
          test "$watch_widget_get_task_allow" = "false"
          test "$watch_widget_app_group" = "$APP_GROUP_ID"
          test "$(date -j -f '%a %b %d %T %Z %Y' "$watch_widget_expiration_date" '+%s')" -gt "$(date '+%s')"

          mkdir -p "$profiles_path"
          cp "$profile_path" "$profiles_path/$profile_uuid.mobileprovision"
          cp "$widget_profile_path" "$profiles_path/$widget_profile_uuid.mobileprovision"
          cp "$watch_profile_path" "$profiles_path/$watch_profile_uuid.mobileprovision"
          cp "$watch_widget_profile_path" "$profiles_path/$watch_widget_profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_WIDGET_PROFILE_NAME=$widget_profile_name" >> "$GITHUB_ENV"
          echo "WATCH_PROFILE_NAME=$watch_profile_name" >> "$GITHUB_ENV"
          echo "WATCH_WIDGET_PROFILE_NAME=$watch_widget_profile_name" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -q '1 valid identities found'

      - name: Generate Xcode project
        working-directory: source
        shell: bash
        run: xcodegen generate >/dev/null

      - name: Archive signed app
        working-directory: source
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          archive_log="$RUNNER_TEMP/meg-archive.log"
          if ! xcodebuild \
            -project Meg.xcodeproj \
            -scheme Meg \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Meg.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            clean archive >"$archive_log" 2>&1; then
            echo "::error::The private source archive failed. Diagnostics are intentionally suppressed in this public repository."
            exit 1
          fi
          echo "Signed archive created."

      - name: Verify signed archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Meg.xcarchive/Products/Applications/Meg.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
          codesign --verify --deep --strict "$app"
          embedded_plist="$RUNNER_TEMP/embedded-profile.plist"
          security cms -D -i "$app/embedded.mobileprovision" > "$embedded_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$embedded_plist")" = "$APPLE_TEAM_ID.$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$embedded_plist")" = "$APP_GROUP_ID"
          widget="$(find "$app/PlugIns" -maxdepth 1 -type d -name '*.appex' -print -quit)"
          test -n "$widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget/Info.plist")" = "$IOS_WIDGET_BUNDLE_ID"
          codesign --verify --strict "$widget"
          widget_embedded_plist="$RUNNER_TEMP/widget-embedded-profile.plist"
          security cms -D -i "$widget/embedded.mobileprovision" > "$widget_embedded_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$widget_embedded_plist")" = "$APPLE_TEAM_ID.$IOS_WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$widget_embedded_plist")" = "$APP_GROUP_ID"
          watch_app="$app/Watch/MegWatch.app"
          test -d "$watch_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$watch_app/Info.plist")" = "$WATCH_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$watch_app/Info.plist")" = "$BUILD_NUMBER"
          codesign --verify --deep --strict "$watch_app"
          watch_embedded_plist="$RUNNER_TEMP/watch-embedded-profile.plist"
          security cms -D -i "$watch_app/embedded.mobileprovision" > "$watch_embedded_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$watch_embedded_plist")" = "$APPLE_TEAM_ID.$WATCH_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$watch_embedded_plist")" = "$APP_GROUP_ID"
          watch_widget="$(find "$watch_app/PlugIns" -maxdepth 1 -type d -name '*.appex' -print -quit)"
          test -n "$watch_widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$watch_widget/Info.plist")" = "$WATCH_WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$watch_widget/Info.plist")" = "$BUILD_NUMBER"
          codesign --verify --strict "$watch_widget"
          watch_widget_embedded_plist="$RUNNER_TEMP/watch-widget-embedded-profile.plist"
          security cms -D -i "$watch_widget/embedded.mobileprovision" > "$watch_widget_embedded_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$watch_widget_embedded_plist")" = "$APPLE_TEAM_ID.$WATCH_WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$watch_widget_embedded_plist")" = "$APP_GROUP_ID"
          echo "Signed archive identity verified."

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options_path" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string>
              <key>${IOS_WIDGET_BUNDLE_ID}</key><string>${IOS_WIDGET_PROFILE_NAME}</string>
              <key>${WATCH_BUNDLE_ID}</key><string>${WATCH_PROFILE_NAME}</string>
              <key>${WATCH_WIDGET_BUNDLE_ID}</key><string>${WATCH_WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          export_log="$RUNNER_TEMP/meg-export.log"
          if ! xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Meg.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$export_options_path" >"$export_log" 2>&1; then
            echo "::error::IPA export failed. Diagnostics are intentionally suppressed in this public repository."
            exit 1
          fi

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          private_keys_path="$HOME/.appstoreconnect/private_keys"
          auth_key_path="$private_keys_path/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          mkdir -p "$private_keys_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$auth_key_path"
          chmod 600 "$auth_key_path"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove temporary credentials
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/meg-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
