name: Build private Meg source

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact notzenco/meg commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meg-private-source-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: notzenco/meg
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.MEG_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
          show-progress: false

      - name: Validate source revision
        working-directory: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          requested="$SOURCE_REF"
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          resolved="$(git rev-parse HEAD)"
          if [[ "$resolved" != "$requested" ]]; then
            echo "::error::Requested source ref did not resolve to the expected commit."
            exit 1
          fi
          echo "Validated the requested private source revision."
          test -f project.yml
          test -f Meg/MegApp.swift

      - name: Verify Xcode image
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Install XcodeGen 2.45.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  /tmp/xcodegen.zip" \
            | shasum -a 256 --check
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo /tmp/xcodegen/install.sh
          xcodegen --version

      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate

      - name: Build iPhone app
        id: build
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/meg-build.log"
          if ! xcodebuild \
            -project Meg.xcodeproj \
            -scheme Meg \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MegDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build >"$build_log" 2>&1; then
            echo "::error::The private source build failed. Diagnostics are intentionally suppressed in this public repository."
            exit 1
          fi
          echo "Private source build succeeded."

      - name: Encrypt private build diagnostics
        if: steps.build.outcome == 'failure'
        env:
          MEG_DIAGNOSTIC_PUBLIC_KEY: ${{ secrets.MEG_DIAGNOSTIC_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MEG_DIAGNOSTIC_PUBLIC_KEY"
          printf '%s' "$MEG_DIAGNOSTIC_PUBLIC_KEY" > "$RUNNER_TEMP/diagnostic-public.pem"
          openssl rand -hex 32 > "$RUNNER_TEMP/diagnostic-key.hex"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/meg-build.log" \
            -out "$RUNNER_TEMP/meg-build.log.enc" \
            -pass file:"$RUNNER_TEMP/diagnostic-key.hex"
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey "$RUNNER_TEMP/diagnostic-public.pem" \
            -in "$RUNNER_TEMP/diagnostic-key.hex" \
            -out "$RUNNER_TEMP/diagnostic-key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f "$RUNNER_TEMP/diagnostic-key.hex" "$RUNNER_TEMP/diagnostic-public.pem"

      - name: Upload encrypted diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-build-diagnostics
          path: |
            ${{ runner.temp }}/meg-build.log.enc
            ${{ runner.temp }}/diagnostic-key.enc
          if-no-files-found: error
          retention-days: 1

      - name: Report private build failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The private source build failed. Encrypted diagnostics are available to the repository owner."
          exit 1
